  host: "https://langfuse.test.arba.gov.ar"
  public_key: "pk-lf-82d7601b-4584-4005-975f-e59d617ca74f"
  secret_key: "sk-lf-edb2e88f-74dc-421d-bb75-adb9af056567"

# Modelo para evaluacion LLM-as-judge (RAGAS internamente lo necesita)
# IMPORTANTE: el LLM evaluator debe ser INDEPENDIENTE de los PoCs para evitar sesgo.
# Los embeddings pueden apuntar a la misma infraestructura (solo miden similitud semantica).
#
# --- Configuracion por defecto ---
# LLM evaluator: DeepSeek (independiente, compatible OpenAI API)
evaluator_llm:
  model: "deepseek-chat"
  api_base: "https://api.deepseek.com/v1"
  api_key: "sk-1231f4df77c24351894e2dd55db2e4b0"

# Embeddings: mismo modelo que usa GraphRAG, via kubectl port-forward directo al vllm.
# kubectl port-forward -n vllm svc/qwen3-embedding-4b-svc 8080:8000
evaluator_embeddings:
  model: "Qwen/Qwen3-Embedding-4B"
  api_base: "http://localhost:8080/v1"
  api_key: "dummy"

# --- Alternativas comentadas ---
# Opcion OpenAI (LLM + embeddings):
# evaluator_llm:
#   model: "gpt-4o-mini"
#   api_base: "https://api.openai.com/v1"
#   api_key: "${OPENAI_API_KEY}"
# evaluator_embeddings:
#   model: "text-embedding-3-small"
#   api_base: "https://api.openai.com/v1"
#   api_key: "${OPENAI_API_KEY}"

# Targets: cada PoC que vamos a evaluar
targets:
  lightrag:
    name: "LightRAG"
    base_url: "https://lightrag.test.arba.gov.ar"
    modes:
      - local
      - global
      - hybrid
      - naive
      - mix
    ingest_endpoint: "/documents/upload"
    reindex_endpoint: null  # LightRAG indexa automaticamente al subir
    query_endpoint: "/query"

  llamaindex:
    name: "LlamaIndex"
    base_url: "https://llamaindex.test.arba.gov.ar"
    modes:
      - simple
      - subquestion
      - chat
    ingest_endpoint: "/ingest"
    reindex_endpoint: "/reindex"
    query_endpoint: "/query"

  langchain:
    name: "LangChain"
    base_url: "https://langchain.test.arba.gov.ar"
    modes:
      - simple
      - multi-query
      - agent
      - chat
    ingest_endpoint: "/ingest"
    reindex_endpoint: "/reindex"
    query_endpoint: "/query"

  graphrag_ms:
    name: "MS GraphRAG"
    base_url: "https://graphrag-ms.test.arba.gov.ar"
    modes:
      - local
      - global
      - drift
    ingest_endpoint: "/ingest"
    reindex_endpoint: null  # MS GraphRAG requiere index manual por CLI
    query_endpoint: "/query"

  ragflow:
    name: "RAGFlow"
    base_url: "https://ragflow.test.arba.gov.ar"
    api_key: "ragflow-eval-99e1dd1aebe5468bbf59adf0556fa980"               # API key de RAGFlow
    modes:
      - chat
    # Usa target especial (ragflow.py) — no endpoints simples
